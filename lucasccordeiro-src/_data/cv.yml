cv:
  name: Lucas C. Cordeiro
  label: Full Professor of Computer Science, University of Manchester
  email: lucas.cordeiro@manchester.ac.uk
  location: Manchester, UK
  image: ""
  summary: >
    Software engineering, formal methods, automated program verification and synthesis, software
    testing, security, and embedded and cyber-physical systems. Leads the Systems and Software
    Security (S3) Research Group and directs the Arm Centre of Excellence at the University of
    Manchester.

  social_networks:
    - network: GitHub
      username: lucasccordeiro
    - network: LinkedIn
      username: lucas-cordeiro-3156233

  sections:
    Education:
      - institution: University of Southampton
        location: Southampton, UK
        url: https://www.southampton.ac.uk/
        area: Computer Science
        studyType: PhD
        end_date: 2011
        highlights:
          - "Thesis: SMT-Based Bounded Model Checking of Multi-threaded Software in Embedded Systems."
          - "Supervisor: Prof. Bernd Fischer. ORSAS/ECS scholarship holder."

      - institution: Federal University of Amazonas
        location: Manaus, Brazil
        url: https://ufam.edu.br/
        area: Informatics
        studyType: MSc
        end_date: 2007
        highlights:
          - "Dissertation: An Agile HW/SW Development Methodology for Embedded Systems."
          - "Supervisor: Prof. Raimundo S. Barreto."

      - institution: Federal University of Amazonas
        location: Manaus, Brazil
        area: Electrical Engineering
        studyType: BSc
        end_date: 2004
        highlights:
          - "Project: Developing Real-Time Applications with LEGO Mindstorms."
          - CAPES/DAAD scholarship at the University of Stuttgart, Germany, 2003-2004.

    Experience:
      - company: University of Manchester
        position: Full Professor
        location: Manchester, UK
        start_date: 2018
        end_date: present
        highlights:
          - Director of Business Engagement and Innovation, Department of Computer Science.
          - Director of the Arm Centre of Excellence.
          - Leader of the Systems and Software Security (S3) Research Group.
          - Leader of the Software Security and Automated Reasoning theme in the Advanced Computer Science MSc programme.
          - Member of the EPSRC Peer Review Full College.

      - company: Federal University of Amazonas
        position: Associate Professor
        location: Manaus, Brazil
        start_date: 2009
        end_date: present
        highlights:
          - Permanent member of the postgraduate programmes in Electrical Engineering (PPGEE) and Informatics (PPGI).
          - Leader of the Systems and Software Verification Research Group.
          - Course Leader of Electrical Engineering, 2011-2015.

      - company: University of Oxford / Diffblue
        position: Researcher / Research Engineer
        location: Oxford, UK
        start_date: 2016
        end_date: 2018
        highlights:
          - Extended the CProver framework to support exception handling and the Java standard libraries.
          - Implemented components of the CounterExample Guided Inductive Synthesis (CEGIS) framework.
          - Built tools to synthesise, verify and validate digital control systems with uncertainties.

      - company: ByteRepair
        position: Scientific Lead Advisor
        location: Manchester, UK
        start_date: 2025
        end_date: present
        highlights:
          - University of Manchester spinout applying formal verification to automated code security analysis and repair.

      - company: Technology Innovation Institute (TII)
        position: Consultant and Advisor, Digital Security Unit
        location: Abu Dhabi, UAE
        start_date: 2022
        end_date: 2023
        highlights:
          - Advised the Digital Security Unit's research programmes, strategy and roadmap.

      - company: R&D Center for the Industrial Pole of Manaus (CT-PIM) / NXP
        position: Set-top Box Software Engineer
        location: Manaus, Brazil
        start_date: 2007
        end_date: 2008
        highlights:
          - Linux drivers for ISDB-T, DVB-T and DVB-S2 tuner and demodulator silicon.
          - Automated unit and functional tests for Linux device drivers.

      - company: BenQ-Siemens Eletroeletronica S.A.
        position: Software Engineer
        location: Manaus, Brazil
        start_date: 2005
        end_date: 2007
        highlights:
          - Requirements, planning and tracking for the linuX Mobile Phone Manager (XMPM).
          - Configuration, change, build and release management for Siemens mobile phone generations 75 and 85.

    Awards:
      - name: Amazon Research Award in Automated Reasoning
        awarder: Amazon Science
        date: 2026
        url: https://www.amazon.science/research-awards/recipients
        summary: >
          For the project "Combining Formal Methods with Large Language Models in ESBMC: Enabling
          Automated Program Verification through AI/ML" (Fall 2025 cycle).

      - name: 56 medals at the international competitions on software verification and testing
        awarder: SV-COMP and Test-Comp, held with ETAPS
        date: 2012-2026
        summary: >
          Gold, silver and bronze medals across fifteen editions of SV-COMP and eight of Test-Comp,
          for ESBMC, FuSeBMC, JBMC, DepthK and Map2Check. Most recently three gold medals at
          Test-Comp 2026 and one gold and one silver at SV-COMP 2026.

      - name: ACM SIGSOFT Distinguished Paper Award
        awarder: 39th IEEE/ACM International Conference on Automated Software Engineering (ASE)
        date: 2024
        summary: For "LLM-Generated Invariants for Bounded Model Checking Without Loop Unrolling".

      - name: Most Influential Paper Award
        awarder: 38th IEEE/ACM International Conference on Automated Software Engineering (ASE)
        date: 2023
        summary: Recognising the lasting impact of our work on SMT-based bounded model checking.

      - name: Best Tool Paper Award
        awarder: 23rd Brazilian Symposium on Information and Computational Systems Security (SBSeg)
        date: 2023

      - name: New verification tool contribution award
        awarder: Rust Foundation / Amazon Web Services
        date: 2025
        summary: For a contribution to the Verifying the Rust Standard Library project.

      - name: ACM SIGSOFT Distinguished Paper Award
        awarder: 33rd International Conference on Software Engineering (ICSE)
        date: 2011

      - name: Best Paper Award
        awarder: V Brazilian Symposium on Computing Systems Engineering (SBESC)
        date: 2015

      - name: Best Paper Award
        awarder: 23rd ACM Symposium on Applied Computing, Real-Time Systems track (SAC)
        date: 2008

    Research grants:
      - label: Combining Formal Methods with Large Language Models in ESBMC
        details: >
          Amazon Research Award in Automated Reasoning, 2026. USD 79,510 unrestricted plus USD 40,000
          in AWS credits. Principal Investigator.
      - label: "GenAIDE: Generative AI for Industrial Design Engineering"
        details: >
          MSCA Doctoral Networks, European Commission Horizon Europe, 2025-2029. GBP 731,055, funding
          two PhD studentships at Manchester. Principal Investigator.
      - label: "AI Trust in Complex Software: Requirements, Understanding and Certification"
        details: BAE Systems, 2024-2025. GBP 300,000. Co-Investigator and work package leader.
      - label: Source Code Security with FuSeBMC-AI
        details: >
          Innovate UK cyber security academic startup accelerator, 2024-2025. GBP 91,500 across two
          phases. Co-Investigator and work package leader.
      - label: "SECCOM: Securing composable hardware platforms"
        details: DSTL and EPSRC, 2023-2026. GBP 1,031,720. Co-Investigator and work package leader.
      - label: "SWPERFI: AI techniques for software performance analysis and optimisation"
        details: Motorola Mobility, 2023-2025. BRL 4,492,346. Co-Investigator and work package leader.
      - label: "EnnCore: End-to-End Conceptual Guarding of Neural Architectures"
        details: EPSRC, 2021-2024. GBP 2,151,950. Principal Investigator.
      - label: "SCorCH: Secure Code for Capability Hardware"
        details: EPSRC, 2020-2023. GBP 1,300,000. Co-Investigator and work package leader.
      - label: Soteria - Security Capabilities of the Morello System
        details: ISCF Digital Security by Design demonstrator, 2021-2024. GBP 2,647,375. Co-Investigator.
      - label: Career total
        details: >
          Over USD 16.4M from Amazon, BAE Systems, British Council, CNPq, EPSRC, the European
          Commission, FAPEAM, GCHQ, Innovate UK, Intel, Motorola, Nokia Institute of Technology,
          the Royal Society, Samsung and UKRI. Full list in the CV PDF.

    Supervision:
      - label: Doctoral
        details: >
          13 PhD theses completed and four in progress, on bounded model checking, hybrid fuzzing,
          neural network verification and repair, and privacy-preserving distributed learning.
      - label: Masters and undergraduate
        details: 3 MPhil dissertations, 34 MSc dissertations, 30 final year projects, 6 scientific initiations and 10 internships.
      - label: External PhD examination
        details: >
          External examiner for 13 PhD candidates at Manchester, Bristol, Edinburgh, Essex, Lancaster,
          UWE, IIT Kanpur, Gran Sasso Science Institute, USP, UFAM and UFMG.

    Teaching:
      - label: Software Security
        details: University of Manchester, graduate, since 2020 (40+ students).
      - label: Algorithms and Data Structures
        details: University of Manchester, undergraduate, since 2020 (300+ students).
      - label: Algorithms and Imperative Programming
        details: University of Manchester, undergraduate, 2018-2019 (280+ students).
      - label: Verification of Software and Systems
        details: Federal University of Amazonas, graduate, since 2021 and 2014-2016.
      - label: Real-Time Systems and Real-Time Programming
        details: Federal University of Amazonas, graduate and undergraduate, 2011-2015 and since 2021.

    Tools:
      - label: ESBMC
        details: >
          Efficient SMT-based Context-Bounded Model Checker for C, C++, CUDA, Python and Solidity.
          Award-winning at SV-COMP and Test-Comp since 2012.
      - label: FuSeBMC
        details: White-box fuzzer combining bounded model checking, fuzzing and static analysis for test generation.
      - label: DSVerifier
        details: Bounded model checker for digital systems with finite word length effects.
      - label: JBMC and Map2Check
        details: Bounded model checking for Java bytecode, and unit test generation and memory safety checking for C.

    Security disclosures:
      - label: CVE-2026-19642
        details: >
          Out-of-bounds write in the Base64 decoder of the AWS SDK for C++ (aws-sdk-cpp), found with
          ESBMC and fixed in v1.11.862, 2026. Joint work with Rafael Sá Menezes.
      - label: CVE-2026-19643
        details: >
          Out-of-bounds read in the Base64 decoder of the AWS SDK for C++ (aws-sdk-cpp), found with
          ESBMC and fixed in v1.11.862, 2026. Joint work with Rafael Sá Menezes.
      - label: CVE-2023-48161
        details: >
          Heap buffer overflow in GifLib 5.2.1, found with TACE and reported in "Rapid Taint Assisted
          Concolic Execution (TACE)", FSE 2024.

    Personal:
      - label: Citizenship
        details: British, Portuguese and Brazilian.

