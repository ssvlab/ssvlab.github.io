name: build lucasccordeiro

# Builds the al-folio source in lucasccordeiro-src/ and commits the generated
# HTML back into this repo. Publishing stays branch-based: this workflow only
# writes files, it does not deploy a Pages artifact, so the other project sites
# and the 634 MB of PDFs under lucasccordeiro/ are never packaged or touched.
#
# Publishes to lucasccordeiro/. The PDF directories are excluded from the sync
# so the existing assets there survive.

# NOTE: GitHub Actions currently refuses to start jobs for this account
# ("your account is locked due to a billing issue"), so the push trigger is
# commented out to avoid a failed run on every source change. Until that is
# resolved, lucasccordeiro-src/publish-preview.sh does the same build locally.
# Restore the push trigger once Actions can run again.
on:
  # push:
  #   branches: [master]
  #   paths: ["lucasccordeiro-src/**", ".github/workflows/build-lucasccordeiro.yml"]
  workflow_dispatch:

concurrency:
  group: build-lucasccordeiro
  cancel-in-progress: true

env:
  PUBLISH_PATH: lucasccordeiro

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: lucasccordeiro-src

      - name: Build
        working-directory: lucasccordeiro-src
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "/${{ env.PUBLISH_PATH }}"

      - name: Check the build carried the publication list over
        working-directory: lucasccordeiro-src
        run: |
          test -f _site/publications/index.html
          links=$(grep -c 'lucasccordeiro/papers/' _site/publications/index.html)
          echo "paper links rendered: $links"
          test "$links" -ge 150

      - name: Publish
        run: |
          # the published folder also holds ~634 MB of PDFs this build does not
          # produce; excluding them means rsync neither transfers nor deletes them
          rsync -a --delete \
            --exclude '/papers/' --exclude '/talks/' --exclude '/supervisions/' \
            --exclude '/awards/' --exclude '/cv/' --exclude '/courses/' \
            --exclude '/vss/' --exclude '/files/' \
            lucasccordeiro-src/_site/ "$PUBLISH_PATH/"
          git config user.name "al-folio build"
          git config user.email "noreply@github.com"
          git add -A "$PUBLISH_PATH"
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Publish $PUBLISH_PATH from ${GITHUB_SHA::7}"
          git push
